<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Page</title>
      <style>
    /* Container styling */
    .input-group {
      display: flex;
      max-width: 400px;
      border: 2px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      transition: border-color 0.2s ease-in-out;
    }

    /* Style container when inner input is focused */
    .input-group:focus-within {
      border-color: #007bff;
    }

    /* Input text box styling */
    .input-group input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    /* Action button styling */
    .input-group button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    /* Hover state for button */
    .input-group button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
    <h1>Welcome to the Film Page!</h1>
    <h2>Find some of your favorite films here by genre.</h2>
    <br>
    <h2>Examples of some genres to search by:</h2>
    <ul>
        <li>Action</li>
        <li>Comedy</li>
        <li>Drama</li>
        <li>History</li>
        <li>Thriller</li>
    </ul>
    <br>
    <form class="input-group" onsubmit="handleSubmit(event)">
        <input type="text" placeholder="Search for a film here." required />
        <button type="submit">Submit</button>
    </form>

  <script>
    function handleSubmit(event) {
      event.preventDefault(); // Prevents page reload
      const inputVal = event.target.querySelector('input').value;
      alert('Submitted value: ' + inputVal);
    }
  </script>
</body>
</html>
