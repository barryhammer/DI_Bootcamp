<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Film Page</title>
</head>
<body>
    <h1>Welcome to the Film Page!</h1>
    <h2>Find some of your favorite films here by genre.</h2>
    <br>
    <h3>Examples of some genres to search by:</h3>
    <ul>
        <li>Action</li>
        <li>Comedy</li>
        <li>Drama</li>
        <li>History</li>
        <li>Thriller</li>
    </ul>
    <br>
    <form class="input-group" onsubmit="handleSubmit(event)">
        <input type="text" placeholder="Search for a film here." required />
        <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
