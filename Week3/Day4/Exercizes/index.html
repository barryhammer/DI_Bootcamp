<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robofriends</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <!-- id="searchBox" allows JavaScript to find the search input. -->
        <h1 class="logo">ROBOFRIENDS</h1>
        <input type="search" id="searchBox" 
               placeholder="Search Robots">
    </header>

    <!-- id="robotContainer" identifies where JavaScript should insert the cards. -->
    <!-- JavaScript inserts the robot cards here -->
    <main class="robot-container" id="robotContainer">
    </main>

    <script src="robofriends.js"></script>
</body>
</html>
