<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

<div class="grids-wrapper">
    <!-- Left Column: Button + 3x7 Grid -->
    <div class="grid-column">
        <button id="clear-btn" class="control-btn">CLEAR</button>
        <div class="grid grid-3x7" id="grid-3x7"></div>
    </div>

    <!-- Right Column: 9x9 Grid -->
    <div class="grid-column no-button">
        <div class="grid grid-9x9" id="grid-9x9"></div>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
