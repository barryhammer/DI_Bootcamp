<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <input type="text" name="Name" id="userName">
        <input type="text" name="EMail" id="email">
        <input type="button" value="Test" onclick="inform"> <!-- Event Handler-->
        <input type="button" id="test2" value="Test2">
        <button type="submit">Submit</button>
    </form>

    <script>
        function inform() {
            alert("The input button has been clicked.")
        }
        document.querySelector("#test2").onclick = () => { alert("The second input button has been clicked.") }
    </script>
</body>
</html>
